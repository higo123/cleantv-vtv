name: Build CleanTV APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Cài gói SDK cần (compileSdk 35)
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Chạy test (lỗi test không chặn việc ra APK)
        continue-on-error: true
        run: ./gradlew :app:testReleaseUnitTest --console=plain

      - name: Build APK release (ký bằng khoá debug vì không có ky.properties)
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Tải APK lên
        uses: actions/upload-artifact@v4
        with:
          name: CleanTV-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
