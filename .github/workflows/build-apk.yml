name: Build CleanTV APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Dùng khoá ký cố định (để APK mới cài đè được APK cũ)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Cài gói SDK cần (compileSdk 35), dùng SDK có sẵn trên máy chạy
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Dựng lại launcher (bản vá giới hạn 4 icon) từ mã nguồn gốc
        id: launcher
        continue-on-error: true
        run: |
          set -euo pipefail
          COMMIT="$(tr -d '[:space:]' < app/src/main/assets/upstream-commit.txt)"
          git clone -q https://github.com/Gathin23/cleanyourtv "$RUNNER_TEMP/up"
          git -C "$RUNNER_TEMP/up" checkout -q "$COMMIT"
          git -C "$RUNNER_TEMP/up" apply --binary "$GITHUB_WORKSPACE/patches/launcher-vgs.patch"
          git -C "$RUNNER_TEMP/up" apply --binary "$GITHUB_WORKSPACE/patches/launcher-vgs-gioi-han.patch"
          echo "sdk.dir=$ANDROID_HOME" > "$RUNNER_TEMP/up/launcher/local.properties"
          cd "$RUNNER_TEMP/up/launcher"
          chmod +x gradlew
          ./gradlew assembleRelease -q --console=plain --no-build-cache --rerun-tasks -PlauncherApplicationId=com.ts.launcher
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/app/src/main/assets/tvhome-xiaomi.apk"
          ./gradlew assembleRelease -q --console=plain --no-build-cache --rerun-tasks
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/app/src/main/assets/tvhome.apk"

      - name: Báo nếu dựng launcher lỗi
        if: steps.launcher.outcome == 'failure'
        run: echo "::warning::Dựng launcher lỗi - APK dùng launcher cũ, KHÔNG có giới hạn 4 icon."

      - name: Chạy test (lỗi test không chặn việc ra APK)
        continue-on-error: true
        run: ./gradlew :app:testReleaseUnitTest --console=plain

      - name: Build APK release (ký bằng khoá debug vì không có ky.properties)
        run: ./gradlew :app:assembleRelease --console=plain --no-build-cache --rerun-tasks

      - name: Kiểm tra APK cuối có launcher đã vá
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          mkdir -p "$RUNNER_TEMP/chk" && cd "$RUNNER_TEMP/chk"
          unzip -q -o "$GITHUB_WORKSPACE/$APK" 'assets/tvhome.apk' 'assets/tvhome-xiaomi.apk'
          for f in assets/tvhome.apk assets/tvhome-xiaomi.apk; do
            mkdir -p "x_$(basename $f)" && unzip -q -o "$f" 'classes*.dex' -d "x_$(basename $f)"
            n=$(cat x_$(basename $f)/classes*.dex | grep -a -c "locked_apps" || true)
            echo "$f: sha256=$(sha256sum $f | cut -c1-12) co_locked_apps=$n co_live_tv_on_wake=$(cat x_$(basename $f)/classes*.dex | grep -a -c live_tv_on_wake || true)"
            test "$n" -gt 0
          done

      - name: In chữ ký (phải giống nhau giữa các lần dựng)
        run: |
          AS="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          cd "$RUNNER_TEMP/chk"
          for f in "$GITHUB_WORKSPACE/$(ls $GITHUB_WORKSPACE/app/build/outputs/apk/release/*.apk | head -n 1 | xargs -n1 basename | sed 's#^#app/build/outputs/apk/release/#')" assets/tvhome.apk assets/tvhome-xiaomi.apk; do
            echo "$(basename $f): $("$AS" verify --print-certs "$f" 2>&1 | grep 'SHA-256' | head -n 1)"
          done

      - name: Tải APK lên
        uses: actions/upload-artifact@v4
        with:
          name: CleanTV-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
